<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background circle -->
  <rect width="32" height="32" rx="8" fill="#0f0f0f"/>
  <!-- Clapperboard body -->
  <rect x="5" y="13" width="22" height="14" rx="2" fill="#e5e5e5"/>
  <!-- Clapperboard stripes (top flap) -->
  <clipPath id="clip">
    <rect x="5" y="6" width="22" height="7" rx="2"/>
  </clipPath>
  <rect x="5" y="6" width="22" height="7" rx="2" fill="#1a1a1a"/>
  <g clip-path="url(#clip)">
    <rect x="4" y="6" width="5" height="7" fill="#e5e5e5"/>
    <rect x="13" y="6" width="5" height="7" fill="#e5e5e5"/>
    <rect x="22" y="6" width="5" height="7" fill="#e5e5e5"/>
  </g>
  <!-- Hinge line -->
  <line x1="5" y1="13" x2="27" y2="13" stroke="#0f0f0f" stroke-width="1.5"/>
  <!-- Play triangle -->
  <path d="M13 17.5 L13 23.5 L20 20.5 Z" fill="#0f0f0f"/>
</svg>
